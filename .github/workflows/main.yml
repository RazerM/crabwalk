---
name: CI

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  FORCE_COLOR: "1"
  UV_NO_SYNC: "1"
  UV_PYTHON_DOWNLOADS: "false"

jobs:
  pre-commit:
    name: "pre-commit"
    runs-on: ubuntu-latest

    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - uses: "j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d" # v3.1.0

  tests:
    name: "Python ${{ matrix.python-version }}"
    runs-on: "ubuntu-latest"

    strategy:
      fail-fast: false
      matrix:
        python-version:
          ["3.11", "3.12", "3.13", "3.14", "3.15", "3.14t", "3.15t"]

    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - uses: "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0" # v7.1.0
        with:
          python-version: "${{ matrix.python-version }}"
          allow-prereleases: true
      - uses: "astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2" # v10.3.3
        with:
          enable-cache: true
      - run: rustup component add llvm-tools-preview
      - name: "Install dependencies"
        run: |
          python -VV
          rustc --version
          python -m site
          uv --version
          uv sync --no-install-project --no-dev --group nox --group coverage
      - name: "Run nox targets for ${{ matrix.python-version }}"
        run: "uv run nox --python ${{ matrix.python-version }}"
      - name: "Convert coverage"
        run: |
          uv run coverage combine
          uv run coverage xml
      - name: "Upload coverage to Codecov"
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  msrv:
    name: "Python ${{ matrix.python-version }} with Rust ${{ matrix.rust-version }}"
    runs-on: "ubuntu-latest"

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.15"]
        rust-version: ["1.88.0"]

    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - uses: "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0" # v7.1.0
        with:
          python-version: "${{ matrix.python-version }}"
      - uses: "astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2" # v10.3.3
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ matrix.rust-version }}
          components: llvm-tools-preview
      - name: "Install dependencies"
        run: |
          python -VV
          rustc --version
          python -m site
          uv --version
          uv sync --no-install-project --no-dev --group nox
      - name: "Run nox"
        run: "uv run nox --python ${{ matrix.python-version }} -s tests"

  required:
    name: "all required checks passed"
    runs-on: "ubuntu-latest"
    if: always()

    needs:
      - pre-commit
      - tests
      - msrv

    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
