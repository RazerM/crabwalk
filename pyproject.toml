[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "crabwalk"
version = "0.1"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []
authors = [
    { name = "Frazer McLean", email = "frazer@frazermclean.co.uk" }
]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
]

[dependency-groups]
dev = [
    { include-group = "coverage" },
    { include-group = "nox" },
    { include-group = "test" },
    { include-group = "typing" },
    "ruff==0.17.3",
]
coverage = [
    "coverage[toml]>=7.17.0",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.2.0",
]
docstest = [
    { include-group = "docs" },
    "doc8>=2.0.0",
]
nox = [
    "nox>=2026.4.10",
]
test = [
    "pytest>=9.2.0",
]
typing = [
    "mypy>=2.4.1",
]

[tool.maturin]
python-source = "src"
python-packages = ["crabwalk"]
manifest-path = "src/rust/Cargo.toml"
module-name = "crabwalk._lib"
locked = true
sdist-generator = "git"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", # ruff defaults
    "I", # isort
    "UP", # pyupgrade
    "RUF", # ruff
    "TC005", "TC006", "TC007", "TC010", # flake8-type-checking
    "EM", # flake8-errmsg
]

[tool.doc8]
ignore-path = "docs/_build/"

[tool.mypy]
check_untyped_defs = true
disallow_any_decorated = true
disallow_any_generics = true
disallow_any_unimported = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_reexport = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pytest]
markers = [
    "tree(*children, chdir=False): Configure the tree_path fixture to create this directory structure.",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["crabwalk", "tests/"]
parallel = true

[tool.coverage.paths]
crabwalk = [
    "src/crabwalk",
    "*.nox/*/lib*/python*/site-packages/crabwalk",
    "*.nox\\*\\Lib\\site-packages\\crabwalk",
]
tests = [
    "tests/",
    "tests\\",
]

[tool.uv]
# Rebuild the extension module when Rust code changes
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/rust/**/*.rs" },
    { file = "src/rust/Cargo.toml" },
]
# Lock latest versions for each Python version
environments = [
    "python_version>='3.13'",
    "python_version=='3.12'",
    "python_version=='3.11'",
]

[tool.uv.dependency-groups]
docs = { requires-python = ">=3.13" }
